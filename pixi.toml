[workspace]
authors = ["Ilya Snegov <unweariedheart@gmail.com>"]
name = "mysql-core"
version = "0.2.1"
license = "MIT-0"
repository = "https://github.com/snegoviol/mysql-core"

channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.82.0"

[tasks]

[dependencies]
python = ">=3.15.0,<3.16"
pydantic-settings = ">=2.16.0,<3"
sqlalchemy = ">=2.1.5,<3"
alembic = ">=1.20.0,<2"
mysql-connector-python = ">=9.7.0,<10"
aiomysql = ">=0.3.2,<0.4"
just = ">=1.59.0,<2"

[feature.test.dependencies]
jupyterlab = "*"

[environments]
test = ["test"]
